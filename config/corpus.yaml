    path: data/raw/gaylord2025_mouse
    label_key: null
    animal_key: null
    condition: {key: age_group, map: {}, family: ageing, control: young}
    status: fill_in
    notes: "Gaylord et al. 2025, Science 390 (Laird lab): mouse and human across age, ~100,000† cells, 11 types incl. glia. The linked accession is the human object; confirm the mouse one."

  # The Benayoun lab menopause-model atlas (Kim et al., bioRxiv 2025; PMC12259092)
  # is three experiments on one SRA project. Each is its own manifest entry so
  # that leave-one-dataset-out holds out a whole experiment and the control
  # of each T3 context is unambiguous. Annotated Seurat objects (the authors'
  # labels) are on Figshare 10.6084/m9.figshare.28934126; raw FASTQ on SRA
  # PRJNA863443; code github.com/BenayounLaboratory/Mouse_Menopause_Models.
  # Counts † are from the paper text; the per-group animal numbers are in
  # the figure legends and are filled on download (plan_update_2026-11-18.md §2.4).
  - name: benayoun_vcd
    enabled: false
    tier: A
    species: mouse
    suspension_type: cell
    assay: "10x"
    sex: female
    source: {type: url, accession: PRJNA863443, urls: []}   # or the Figshare .rds through R/rds_to_mtx.R
    path: data/raw/benayoun_vcd
    label_key: null
    animal_key: null
    condition:
      key: group
      map: {}                      # fill in: vehicle vs VCD x induction age (3 mo | 10 mo) x time post-injection (30 d | 90 d)
      family: chemical_menopause
      control: vehicle
    status: fill_in
    notes: "VCD chemical menopause, 47,386† cells: VCD or vehicle injected at 3 or 10 months, ovaries profiled 30 and 90 d post-injection. Four T3 contexts (benchmark.yaml benayoun_vcd_*), each with its own age-matched vehicle control."

  - name: benayoun_foxl2
    enabled: false
    tier: A
    species: mouse
    suspension_type: cell
    assay: "10x"
    sex: female
    source: {type: url, accession: PRJNA863443, urls: []}
    path: data/raw/benayoun_foxl2
    label_key: null
    animal_key: null
    condition:
      key: group
      map: {}                      # fill in: Foxl2 +/+ vs +/- at ~4 mo and ~9 mo
      family: genotype
      control: wt
    status: fill_in
    notes: "Foxl2 haploinsufficiency, 21,301† cells, littermate controls at ~4 and ~9 months. Exclude Foxl2 from scoring (benchmark.yaml). The authors' transcriptome clock called these ovaries older than their follicle counts say."

  - name: benayoun_ageing
    enabled: false
    tier: A
    species: mouse
    suspension_type: cell
    assay: "10x"
    sex: female
    source: {type: url, accession: PRJNA863443, urls: []}
    path: data/raw/benayoun_ageing
    label_key: null
    animal_key: null
    condition:
      key: group
      map: {young: age_4mo, old: age_20mo}
      family: ageing
      control: age_4mo
      age_days: {age_4mo: 120, age_20mo: 600}
    status: fill_in
    notes: "Natural ageing 4 vs 20 months (C57BL/6JNia), 9,559† cells. The only public mouse ovary set older than 12 months found so far; pairs with isola2024 (3 vs 9 mo) as a b1 source for the ageing family."

  # The first chemotherapy single-nucleus time course of the mouse ovary.
  # Nuclei, like the own data. Deposited at CNCB OMIX, not GEO: the download
  # route is a week-1 check (plan_update_2026-11-18.md §6).
  - name: chemo_poi_2026
    enabled: false
    tier: A
    species: mouse
    suspension_type: nucleus
    assay: "10x"
    sex: female
    source: {type: url, accession: OMIX015442, urls: []}    # https://ngdc.cncb.ac.cn/omix/
    path: data/raw/chemo_poi_2026
    label_key: null                # the paper annotates 8 major types + granulosa sub-states (PGGC, PLGC1-3, MGC, CGC1-2) + oocyte stages
    animal_key: null               # one mouse (both ovaries pooled) per sample; n = 3 per group
    condition:
      key: group
      map: {Sham: sham, Cy-3Day: chemo_3d, Cy-21Day: chemo_21d}
      family: chemotherapy
      control: sham
      time_h: {chemo_3d: 72, chemo_21d: 504}
    status: fill_in
    notes: "Busulfan 30 mg/kg + cyclophosphamide 120 mg/kg i.p. once; sham / 3 d / 21 d; 70,520† nuclei (Stem Cell Res Ther 2026, 10.1186/s13287-026-05064-8). The hAEC-transplantation arm (43,420† cells) is kept out of the core corpus."

