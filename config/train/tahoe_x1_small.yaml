# =====================================================================
# Arm B: a <= 30 M-parameter model from scratch in the Tahoe-x1 stack
# ---------------------------------------------------------------------
# THIS IS NOT A FILE Tahoe-x1 LOADS AS IS. It is the plan's values in the
# shape of their configs/ (tahoebio/tahoe-x1, Apache-2.0, November 2026:
# Composer / llm-foundry with FSDP; test_run.yaml has d 512 and 12
# layers; the 70 M run used global batch 4,800, 6 epochs, lr 3e-4;
# A100-class GPU, CUDA 12.1+, FlashAttention only). Transcribe into their
# format, then `composer scripts/train.py <their file>` from a clone of
# the repo. `ovary-fm train --arm b` copies this file with {corpus},
# {out} and {epochs} filled in.
# =====================================================================
plan:
  arm: B
  licence_note: "Apache-2.0 code and weights; a from-scratch model here is ours to license."

data:
  corpus: "{corpus}"
  vocab: build_from_corpus                   # their vocab json, built from the corpus genes (not vevo_v2_vocab.json)
  species: mouse
  assay_token: suspension_type

model:
  d_model: 256                               # ~10-30 M parameters with 8 layers; the data-limited regime (Kendiukhov 2026)
  n_layers: 8
  n_heads: 8
  expansion_ratio: 4
  attn_impl: flash

trainer:
  global_train_batch_size: 1024
  device_train_microbatch_size: 32
  max_duration: "{epochs}ep"
  lr: 3.0e-4
  warmup: 0.05
  precision: amp_bf16
  fsdp: true
  devices: 4
  save_folder: "{out}/checkpoints"
  seed: 0

ablations:
  # pre-registered (docs/preregistration.md): data-size curve and species
  data_size_cells: [50000, 200000, 1000000, all]
  seeds: [0, 1, 2]
  species: [mouse_only, mouse_plus_human]
