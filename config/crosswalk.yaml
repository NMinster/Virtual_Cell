# --- per dataset: the authors' labels ----------------------------------------
datasets:

  # Isola / Ocañas 2024 (obs cluster.names). Stroma C carries Rgs5, Notch3,
  # Pdgfrb, Abcc9: pericytes. "Epithelium B" (107 cells) carries Mmrn1, Flt4,
  # Prox1, Ccl21d, Reln: lymphatic endothelium, not epithelium
  # (Mouse_Compensatory docs/clustering_review.md).
  isola2024:
    stroma a: {major: Stromal, fine: fibroblast}
    stroma b: {major: Stromal}
    stroma c: {major: Stromal, fine: pericyte}
    theca: {major: Theca}
    granulosa a: {major: Granulosa}
    granulosa b: {major: Granulosa}
    luteal: {major: Luteal}
    endothelium: {major: Endothelial}
    epithelium a: {major: Epithelial, fine: ovarian surface epithelial cell}
    epithelium b: {major: Endothelial, fine: endothelial cell of lymphatic vessel}
    phagocytes a: {major: Immune, fine: macrophage}
    phagocytes b: {major: Immune, fine: macrophage}
    t-lymphocytes: {major: Immune, fine: T cell}
    b-lymphocytes: {major: Immune, fine: B cell}
    oocytes: {major: Oocytes}

  # Morris 2022 Level 0 and Level 1 (the eLife reviewer asked for the
  # mesenchyme names to be made consistent; these are the final ones).
  morris2022:
    granulosa: {major: Granulosa}
    mesenchyme: {major: Stromal}
    immune: {major: Immune}
    endothelium: {major: Endothelial}
    epithelium: {major: Epithelial}
    oocyte: {major: Oocytes}
    gc_preantral: {major: Granulosa}
    gc_antral: {major: Granulosa}
    gc_estrous: {major: Granulosa}
    gc_mitotic: {major: Granulosa}
    gc_mural: {major: Granulosa, fine: mural granulosa cell}
    gc_atretic: {major: Granulosa, fine: atretic granulosa cell}
    gc_cl_active: {major: Luteal}
    gc_cl_lytic: {major: Luteal}
    m_immature theca: {major: Theca, fine: pre-theca cell}
    m_steroidogenic theca: {major: Theca}
    m_dividing mesenchyme: {major: Stromal}
    m_cortical stroma: {major: Stromal, fine: fibroblast}
    m_medullary stroma: {major: Stromal, fine: fibroblast}
    m_smooth muscle: {major: Stromal, fine: smooth muscle cell}
    m_pericyte: {major: Stromal, fine: pericyte}
    b_cell: {major: Immune, fine: B cell}
    t_cell: {major: Immune, fine: T cell}
    macrophage: {major: Immune, fine: macrophage}
    dendritic_cell: {major: Immune, fine: dendritic cell}
    granulocyte: {major: Immune, fine: granulocyte}
    en_blood: {major: Endothelial}
    en_lymph: {major: Endothelial, fine: endothelial cell of lymphatic vessel}

  # Huang 2025, obs ff_names (16 named clusters; read from the converted object on 2026-11-04).
  # The numbered ones (Granulosa 1-3, Stroma 1-2, Theca 1-2, Luteal 1-2, Endothelial 1-2) resolve
  # through the stem rule; the review table lists every name with its mapping for the lab.
  huang2025:
    myeloid: {major: Immune}
    epithelial: {major: Epithelial}
    cumulus 1: {major: Granulosa, fine: cumulus cell}
    cumulus 2: {major: Granulosa, fine: cumulus cell}

  # The own data: the final eight types of Mouse_Compensatory
  mouse_comp_30d:
    oocytes: {major: Oocytes}
    granulosa: {major: Granulosa}
    luteal: {major: Luteal}
    theca: {major: Theca}
    stromal: {major: Stromal}
    endothelial: {major: Endothelial}
    epithelial: {major: Epithelial}
