# =====================================================================
# Virtual_Cell :: the label crosswalk (atlas labels -> Cell Ontology)
# ---------------------------------------------------------------------
# Two levels. `major` is the eight-type vocabulary of Mouse_Compensatory
# (annotate.major_types), the level every dataset reaches and the level
# T1 is scored at. `fine` is the Cell Ontology term the authors' markers
# justify, where one exists; between April 2024 and June 2026 the
# ontology gained the stage-resolved granulosa, theca and luteal terms
# listed under `cl_terms`, and no published atlas uses them yet.
#
# Rules (docs/project_plan.md 4.3):
#   * a label maps to the most specific term its authors' markers
#     justify; one with no term keeps `fine: null`;
#   * a label the crosswalk does not list is NOT folded in: it keeps its
#     text, gets major type `Unassigned` and crosswalk_status `unmapped`,
#     and shows up in tables/harmonise/crosswalk_review.csv for the lab;
#   * matching is case-insensitive after stripping; `global` applies when
#     a dataset block has no entry for the label.
#
# A label that is not listed is also tried with a trailing number, suffix
# or the word "cells" removed ("Granulosa 3" -> granulosa, "Theca_00" ->
# theca, "Luteal Cells" -> luteal) against the dataset block and then the
# global map; such a hit carries crosswalk_status `mapped_stem` so the
# review table shows it was not an exact entry.
#
# `cl_id: verify` marks a term whose identifier was not confirmed against
# the ontology from this machine: check it at https://www.ebi.ac.uk/ols4
# (search the label) before the crosswalk is released. The seed of this
# file is Mouse_Compensatory/config/reference_labels.yaml.
# =====================================================================

major_types: [Oocytes, Granulosa, Luteal, Theca, Stromal, Endothelial, Epithelial, Immune]

cl_terms:
  major:
    Oocytes:     {cl_id: "CL:0000023", cl_label: oocyte}
    Granulosa:   {cl_id: "CL:0000501", cl_label: granulosa cell}
    Luteal:      {cl_id: "CL:0000175", cl_label: luteal cell}
    Theca:       {cl_id: "CL:0000503", cl_label: theca cell}
    Stromal:     {cl_id: "CL:0002132", cl_label: stromal cell of ovary}
    Endothelial: {cl_id: "CL:0000115", cl_label: endothelial cell}
    Epithelial:  {cl_id: "CL:0000066", cl_label: epithelial cell}        # OSE and rete; see fine
    Immune:      {cl_id: "CL:0000738", cl_label: leukocyte}
    Unassigned:  {cl_id: null, cl_label: null}
  fine:
    # granulosa stages (CL additions 2024-2026, anchored to Morris 2022 markers)
    pre-granulosa cell:               {cl_id: "CL:4033066", major: Granulosa}
    mural granulosa cell:             {cl_id: "CL:4033067", major: Granulosa}
    cumulus cell:                     {cl_id: "CL:0000711", major: Granulosa}
    squamous granulosa cell:          {cl_id: verify, major: Granulosa}   # primordial follicle
    cuboidal granulosa cell:          {cl_id: verify, major: Granulosa}   # primary follicle
    atretic granulosa cell:           {cl_id: verify, major: Granulosa}
    # luteal (early Parm1-high, late Akr1c18-high; replaced small / large)
    early luteal cell:                {cl_id: "CL:4052046", major: Luteal, markers: [Parm1]}
    late luteal cell:                 {cl_id: "CL:4052047", major: Luteal, markers: [Akr1c18]}
    # theca and interstitium
    pre-theca cell:                   {cl_id: verify, major: Theca}
    theca interna cell:               {cl_id: verify, major: Theca}
    theca externa cell:               {cl_id: verify, major: Theca}
    atretic theca cell:               {cl_id: verify, major: Theca}
    steroidogenic stromal cell of ovary: {cl_id: verify, major: Theca}   # "Enpp2- interstitial cells"; in this vocabulary the steroidogenic interstitium sits with Theca
    # stroma and vessels
    fibroblast:                       {cl_id: "CL:0000057", major: Stromal}
    pericyte:                         {cl_id: "CL:0000669", major: Stromal}
    smooth muscle cell:               {cl_id: "CL:0000192", major: Stromal}
    endothelial cell of lymphatic vessel: {cl_id: "CL:0002138", major: Endothelial}
    # epithelium
    ovarian surface epithelial cell:  {cl_id: verify, major: Epithelial}
    # immune
    macrophage:                       {cl_id: "CL:0000235", major: Immune}
    monocyte:                         {cl_id: "CL:0000576", major: Immune}
    dendritic cell:                   {cl_id: "CL:0000451", major: Immune}
    neutrophil:                       {cl_id: "CL:0000775", major: Immune}
    granulocyte:                      {cl_id: "CL:0000094", major: Immune}
    T cell:                           {cl_id: "CL:0000084", major: Immune}
    B cell:                           {cl_id: "CL:0000236", major: Immune}
    natural killer cell:              {cl_id: "CL:0000623", major: Immune}
    erythrocyte:                      {cl_id: "CL:0000232", major: Unassigned}

