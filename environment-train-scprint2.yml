# scPRINT-2 (cantinilab/scPRINT-2, GPL-3): the zero-shot `fm --tool scprint2`
# embedding AND arm A (continued pretraining), one env for both.
#
# What the PyPI package gives: inference (`scprint2 embed`, denoise, GRN).
# What pretraining needs on top: the dev clone of the repo and of its
# companions (the README: "git clone the repo to have access to all the
# pre-training functionalities"); `bash biowulf/setup_env.sh --train
# scprint2` builds this env, clones scPRINT-2, scDataLoader, GRnnData and
# benGRN under /data/$USER/ovary_fm/src and pip-installs them editable.
#
# Every use needs a laminDB instance (ontologies for genes, cell types,
# organisms): once,
#     lamin init --storage /data/$USER/ovary_fm/lamin --name ovary_fm --modules bionty
#     scprint2 easy_setup
# and the checkpoint, public on the hub under Apache-2.0 (no registration, no email):
#     hf download jkobject/scPRINT small-v2.ckpt --local-dir $HF_HOME/scprint
# (both scPRINT and scPRINT-2 checkpoints sit on the scPRINT page.)
#
# Pins: torch 2.8.0 from the package; Python 3.10-3.12. `scprint2[flash]`
# adds the triton flash-attention paths (training on A100 only; not
# needed for inference). Export HF_HOME under /data/$USER and the proxy.
name: ovary_fm_scprint2
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - git
  - libstdcxx-ng>=13
  - pip:
      - scprint2
      - scanpy>=1.10
      - anndata>=0.10
      - pyarrow>=14.0
      - huggingface_hub
