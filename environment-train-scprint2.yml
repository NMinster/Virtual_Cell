# Arm A: scPRINT-2 continued pretraining (cantinilab/scPRINT-2, GPL-3).
# The same package serves the zero-shot `fm --tool scprint2` embedding, so
# one env covers both. Built by `bash biowulf/setup_env.sh --train scprint2`.
#
# The package pins torch 2.8.0 and needs Python 3.10-3.12; pretraining
# "can be done on any hardware with a 20GB NVIDIA GPU" and the
# maintainers' SLURM recipe is 4 x A40-40GB, 16 CPU and 90 GB RAM per GPU
# (docs/pretrain.md in their repo). Data loading goes through scDataLoader
# (lamindb-backed). Weights: `medium-v2` etc. from the Hugging Face hub on
# first use; export HF_HOME=/data/$USER/hf and the proxy.
# Licence: GPL-3 on the code; no separate weights licence file (ask the
# authors before redistributing a fine-tuned checkpoint).
name: ovary_fm_scprint2
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - libstdcxx-ng>=13
  - pip:
      - scprint2
      - scdataloader
      - scanpy>=1.10
      - anndata>=0.10
      - pyarrow>=14.0
