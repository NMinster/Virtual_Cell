# Arm C, the primary baseline: scVI / scANVI (scverse/scvi-tools, BSD-3)
# on the corpus. Built by `bash biowulf/setup_env.sh --train scvi`; used by
# `ovary-fm train --arm c`, which writes results/train/arm_c/embedding.parquet
# in the same format as the fm stage so `t1 --rep` scores it.
name: ovary_fm_scvi
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - libstdcxx-ng>=13
  - pip:
      - scvi-tools>=1.2
      - scanpy>=1.10
      - anndata>=0.10
      - pyarrow>=14.0
